services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ova
      POSTGRES_PASSWORD: ova
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ova -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  db-setup:
    build:
      context: .
      dockerfile: Dockerfile
      target: db-setup
    environment:
      DATABASE_URL: postgresql://ova:ova@postgres:5432/ova_app
      PAYLOAD_DATABASE_URL: postgresql://ova:ova@postgres:5432/ova_cms
      PGPASSWORD: ova
      PGHOST: postgres
      PGUSER: ova
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change-me-in-production-min-32-chars-long}
      NODE_ENV: development
      CI: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://ova:ova@postgres:5432/ova_app
      PAYLOAD_DATABASE_URL: postgresql://ova:ova@postgres:5432/ova_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change-me-in-production-min-32-chars-long}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-min-32-chars-long}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3000}
      NODE_ENV: production
    depends_on:
      db-setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
